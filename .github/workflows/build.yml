name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Re-create Project & Clean Pubspec Workmanager
        run: |
          rm -rf android
          flutter create . --org com.renantefullo --project-name macro_auto_cleaner
          
          # Alisin muna ang workmanager sa pubspec.yaml kung nagdudulot ng error sa compilation
          python3 -c '
          import yaml
          with open("pubspec.yaml", "r") as f:
              lines = f.readlines()
          
          new_lines = []
          skip = False
          for line in lines:
              if "workmanager:" in line:
                  skip = True
                  continue
              if skip and (line.startswith("  ") or line.strip() == ""):
                  continue
              else:
              skip = False
              new_lines.append(line)
              
          with open("pubspec.yaml", "w") as f:
              f.writelines(new_lines)
          '

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClean-APK-RenanteFullo
          path: build/app/outputs/flutter-apk/app-release.apk
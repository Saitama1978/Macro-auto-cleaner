name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK (3.19.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Re-create Android Project
        run: |
          rm -rf android
          flutter create . --org com.renantefullo --project-name macro_auto_cleaner

      - name: Configure Desugaring and MultiDex
        run: |
          BUILD_FILE="android/app/build.gradle.kts"
          if [ -f "$BUILD_FILE" ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8' "$BUILD_FILE"
            sed -i '/defaultConfig {/a \        multiDexEnabled = true' "$BUILD_FILE"
            echo -e '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n    implementation("androidx.multidex:multidex:2.0.1")\n}' >> "$BUILD_FILE"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroAutoCleaner-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
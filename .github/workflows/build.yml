name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Re-create Project & Configure Desugaring
        run: |
          rm -rf android
          flutter create . --org com.renantefullo --project-name macro_auto_cleaner
          
          # Inject coreLibraryDesugaring & Java 8 options into build.gradle
          sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
          sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClean-APK-RenanteFullo
          path: build/app/outputs/flutter-apk/app-release.apk
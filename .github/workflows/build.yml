name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Re-create Project & Fix Workmanager Compatibility
        run: |
          rm -rf android
          flutter create . --org com.renantefullo --project-name macro_auto_cleaner
          
          # Inject Desugaring & Java 8 setup
          python3 -c '
          import os

          path_kts = "android/app/build.gradle.kts"
          path_groovy = "android/app/build.gradle"

          if os.path.exists(path_kts):
              with open(path_kts, "r") as f:
                  content = f.read()
              
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8")
              
              if "coreLibraryDesugaring" not in content:
                  content += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"
                      
              with open(path_kts, "w") as f:
                  f.write(content)

          elif os.path.exists(path_groovy):
              with open(path_groovy, "r") as f:
                  content = f.read()
              
              if "coreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8")
              
              if "coreLibraryDesugaring" not in content:
                  content += "\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"
                      
              with open(path_groovy, "w") as f:
                  f.write(content)
          '

          # Inject dependency_override para sa workmanager
          python3 -c '
          with open("pubspec.yaml", "r") as f:
              content = f.read()
          
          override_block = "\ndependency_overrides:\n  workmanager:\n    git:\n      url: https://github.com/fluttercommunity/flutter_workmanager.git\n      ref: main\n"
          
          if "dependency_overrides:" not in content:
              content += override_block
          
          with open("pubspec.yaml", "w") as f:
              f.write(content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClean-APK-RenanteFullo
          path: build/app/outputs/flutter-apk/app-release.apk
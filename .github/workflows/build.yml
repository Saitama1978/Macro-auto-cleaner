name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK (3.19.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true

      - name: Re-create Android Project Structure
        run: |
          rm -rf android
          flutter create . --org com.renantefullo --project-name macro_auto_cleaner

      - name: Configure Gradle Properly (Desugaring, MultiDex & Dependencies)
        run: |
          python3 -c '
          import os

          path_kts = "android/app/build.gradle.kts"
          if os.path.exists(path_kts):
              with open(path_kts, "r") as f:
                  content = f.read()
              
              # 1. Enable coreLibraryDesugaring at Java compatibility
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_1_8\n        targetCompatibility = JavaVersion.VERSION_1_8")
              
              # 2. Enable MultiDex
              if "multiDexEnabled" not in content:
                  content = content.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true")

              # 3. Siguraduhing may dependencies block at nasa loob ang coreLibraryDesugaring at multidex
              desugar_code = """
dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
    implementation("androidx.multidex:multidex:2.0.1")
}
"""
              if "coreLibraryDesugaring" not in content:
                  content += desugar_code
              elif "dependencies {" not in content:
                  content += desugar_code

              with open(path_kts, "w") as f:
                  f.write(content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroAutoCleaner-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk  